name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run tests with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Run tests
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  release:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          platforms=(
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for platform in "${platforms[@]}"; do
            read -r goos goarch <<< "$platform"
            package="dpull-${VERSION}-${goos}-${goarch}"
            binary="dpull"
            if [[ "$goos" == "windows" ]]; then
              binary="dpull.exe"
            fi

            package_dir="staging/${package}"
            mkdir -p "$package_dir"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X github.com/imythu/dpull/cmd.Version=${VERSION}" \
              -o "${package_dir}/${binary}" .
            cp README.md LICENSE "$package_dir/"

            if [[ "$goos" == "windows" ]]; then
              (cd staging && zip -qr "../dist/${package}.zip" "$package")
            else
              tar -C staging -czf "dist/${package}.tar.gz" "$package"
            fi
          done

          (cd dist && sha256sum * > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag \
            --title "dpull ${VERSION}" \
            --latest \
            --generate-notes
