name: Beta Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

  release:
    name: Build and publish beta
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: beta-${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging

          platforms=(
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
            "darwin amd64"
            "darwin arm64"
          )

          for platform in "${platforms[@]}"; do
            read -r goos goarch <<< "$platform"
            package="dpull-${VERSION}-${goos}-${goarch}"
            binary="dpull"
            if [[ "$goos" == "windows" ]]; then
              binary="dpull.exe"
            fi

            package_dir="staging/${package}"
            mkdir -p "$package_dir"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "${package_dir}/${binary}" .
            cp README.md LICENSE "$package_dir/"

            if [[ "$goos" == "windows" ]]; then
              (cd staging && zip -qr "../dist/${package}.zip" "$package")
            else
              tar -C staging -czf "dist/${package}.tar.gz" "$package"
            fi
          done

          (cd dist && sha256sum * > checksums.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dpull-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "dpull ${VERSION}" \
            --prerelease \
            --generate-notes
